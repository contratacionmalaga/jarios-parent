name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven and Dependency Check data
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/dependency-check-data
          key: maven-quality-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-quality-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Quality checks
        run: ./mvnw -B -ntp -Pquality verify
