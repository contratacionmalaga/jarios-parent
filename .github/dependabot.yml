version: 2

# PACKAGES_TOKEN must be a Dependabot secret with read access to these packages.
registries:
  github-jarios-parent:
    type: maven-repository
    url: https://maven.pkg.github.com/contratacionmalaga/jarios-parent
    username: contratacionmalaga
    password: ${{ secrets.PACKAGES_TOKEN }}
  github-email-helper:
    type: maven-repository
    url: https://maven.pkg.github.com/contratacionmalaga/email_helper
    username: contratacionmalaga
    password: ${{ secrets.PACKAGES_TOKEN }}
  github-encrypt-helper:
    type: maven-repository
    url: https://maven.pkg.github.com/contratacionmalaga/encrypt_helper
    username: contratacionmalaga
    password: ${{ secrets.PACKAGES_TOKEN }}
  github-properties-helper:
    type: maven-repository
    url: https://maven.pkg.github.com/contratacionmalaga/properties_helper
    username: contratacionmalaga
    password: ${{ secrets.PACKAGES_TOKEN }}
  github-version-helper:
    type: maven-repository
    url: https://maven.pkg.github.com/contratacionmalaga/version_helper
    username: contratacionmalaga
    password: ${{ secrets.PACKAGES_TOKEN }}

updates:
  - package-ecosystem: maven
    directory: /
    registries:
      - github-jarios-parent
      - github-email-helper
      - github-encrypt-helper
      - github-properties-helper
      - github-version-helper
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      jackson:
        patterns:
          - "com.fasterxml.jackson*:*"
      hibernate:
        patterns:
          - "org.hibernate.orm:*"
      testcontainers:
        patterns:
          - "org.testcontainers:*"
      surefire-failsafe:
        patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-failsafe-plugin"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
